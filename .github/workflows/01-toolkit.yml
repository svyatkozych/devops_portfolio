name: 01-linux-devops-toolkit

on:
  push:
    branches: [main]
    paths:
      - '01-linux-devops-toolkit/**'
      - '.github/workflows/01-toolkit.yml'
  pull_requests:
    paths:
      - '01-linux-devops-toolkit/**'
      - '.github/workflows/01-toolkit.yml'

  defaults:
    run:
      working-directory: 01-linux-devops-toolkit

  jobs:
    bash:
      name: bash (shellcheck + bats)
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v4
        - name: Install tools
          run: sudo apt-get update && sudo apt-get install -y shellcheck bats
        - name: Lint
          run: make lint
        - name: Test
          run: make test
python:
    name: python (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 01-linux-devops-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 01-linux-devops-toolkit/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: make lint-py
      - name: Test
        run: make test-py
