name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: project
    attributes:
      label: Project folder
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected vs actual result
    validations:
      required: true
