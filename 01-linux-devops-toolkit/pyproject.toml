[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool"
version = "0.1.0"
description = "DevOps helper CLI: log analysis, SSL checks, system report, alerts"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "psutil>=5.9", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
devtool = "devtool.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
